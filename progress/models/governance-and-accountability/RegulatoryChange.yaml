name: "RegulatoryChange"
domain: "Governance and accountability"
domain_slug: "governance-and-accountability"
purpose: "Tracked legal or regulatory development and the organization decision about implementation."
fields:
  - name: "id"
    type: "string"
    required: true
    description: "Unique identifier."
  - name: "organization_id"
    type: "string"
    required: true
    description: "Parent organization."
  - name: "jurisdiction"
    type: "string"
    required: true
    description: "Jurisdiction affected."
  - name: "title"
    type: "string"
    required: true
    description: "Name of the change."
  - name: "source_reference"
    type: "string"
    required: false
    description: "Reference to law, guidance, case, or update."
  - name: "identified_at"
    type: "datetime"
    required: true
    description: "When the change was identified."
  - name: "effective_at"
    type: "datetime"
    required: false
    description: "When the change becomes effective."
  - name: "impact_summary"
    type: "text"
    required: false
    description: "Summary of expected impact."
  - name: "decision"
    type: "text"
    required: false
    description: "Implementation decision or rationale."
  - name: "implementation_status"
    type: "enum"
    required: true
    description: "Status of the response."
  - name: "owner_party_id"
    type: "string"
    required: false
    description: "Responsible owner."
relations:
  - name: "organization"
    target: "Organization"
    cardinality: "many-to-one"
    description: "Parent organization."
  - name: "owner"
    target: "Party"
    cardinality: "many-to-one"
    description: "Responsible owner."
  - name: "legal_requirements"
    target: "LegalRequirement"
    cardinality: "one-to-many"
    description: "Requirements created or updated by the change."
  - name: "assessments"
    target: "Assessment"
    cardinality: "one-to-many"
    description: "Assessments triggered by the change."
  - name: "evidence"
    target: "Evidence"
    cardinality: "one-to-many"
    description: "Supporting memos, opinions, and decision records."
notes:
  - "Directly supports tracking new laws and documenting implementation choices."
source_context:
  - "Derived from NIST Privacy Framework concepts such as inventory, governance, risk, control, communication, and protection."
  - "Derived from Nymity management activities such as governance, notices, rights handling, assessments, vendor oversight, and breach response."
