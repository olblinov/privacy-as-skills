name: "TransferMechanism"
domain: "Processing inventory and data mapping"
domain_slug: "processing-inventory-and-data-mapping"
purpose: "Formal mechanism authorizing or explaining a regulated transfer of personal data."
fields:
  - name: "id"
    type: "string"
    required: true
    description: "Unique identifier."
  - name: "organization_id"
    type: "string"
    required: true
    description: "Parent organization."
  - name: "mechanism_type"
    type: "string"
    required: true
    description: "Type such as SCC, BCR, adequacy, or approval."
  - name: "name"
    type: "string"
    required: true
    description: "Friendly name of the mechanism."
  - name: "jurisdiction_scope"
    type: "string"
    required: false
    description: "Territorial scope."
  - name: "reference_document"
    type: "string"
    required: false
    description: "Reference to executed agreement or filing."
  - name: "approval_required"
    type: "boolean"
    required: false
    description: "Whether regulator or internal approval is required."
  - name: "valid_from"
    type: "date"
    required: false
    description: "Effective date."
  - name: "valid_until"
    type: "date"
    required: false
    description: "Expiry date."
  - name: "status"
    type: "enum"
    required: true
    description: "Lifecycle status."
relations:
  - name: "organization"
    target: "Organization"
    cardinality: "many-to-one"
    description: "Parent organization."
  - name: "data_flows"
    target: "DataFlow"
    cardinality: "one-to-many"
    description: "Flows relying on the mechanism."
  - name: "third_party_engagements"
    target: "ThirdPartyEngagement"
    cardinality: "one-to-many"
    description: "Engagements supported by the mechanism."
notes:
  - "Directly reflects transfer-mechanism tracking in the source frameworks."
source_context:
  - "Derived from NIST Privacy Framework concepts such as inventory, governance, risk, control, communication, and protection."
  - "Derived from Nymity management activities such as governance, notices, rights handling, assessments, vendor oversight, and breach response."
