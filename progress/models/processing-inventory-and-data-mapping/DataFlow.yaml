name: "DataFlow"
domain: "Processing inventory and data mapping"
domain_slug: "processing-inventory-and-data-mapping"
purpose: "Maps a transfer, disclosure, or movement of personal data within or outside the organization."
fields:
  - name: "id"
    type: "string"
    required: true
    description: "Unique identifier."
  - name: "processing_activity_id"
    type: "string"
    required: true
    description: "Generating processing activity."
  - name: "source_system_id"
    type: "string"
    required: false
    description: "Source system asset."
  - name: "target_system_id"
    type: "string"
    required: false
    description: "Target system asset."
  - name: "from_party_id"
    type: "string"
    required: false
    description: "Originating party."
  - name: "to_party_id"
    type: "string"
    required: false
    description: "Receiving party."
  - name: "origin_jurisdiction"
    type: "string"
    required: false
    description: "Origin location."
  - name: "destination_jurisdiction"
    type: "string"
    required: false
    description: "Destination location."
  - name: "transfer_frequency"
    type: "string"
    required: false
    description: "How often the flow occurs."
  - name: "disclosure_type"
    type: "string"
    required: false
    description: "Type such as internal, vendor, regulator, or public."
  - name: "includes_personal_data"
    type: "boolean"
    required: true
    description: "Whether personal data is included."
  - name: "transfer_mechanism_id"
    type: "string"
    required: false
    description: "Applicable transfer mechanism."
  - name: "status"
    type: "enum"
    required: true
    description: "Lifecycle status."
relations:
  - name: "processing_activity"
    target: "ProcessingActivity"
    cardinality: "many-to-one"
    description: "Related processing activity."
  - name: "source_system"
    target: "SystemAsset"
    cardinality: "many-to-one"
    description: "Source system."
  - name: "target_system"
    target: "SystemAsset"
    cardinality: "many-to-one"
    description: "Target system."
  - name: "from_party"
    target: "Party"
    cardinality: "many-to-one"
    description: "Originating party."
  - name: "to_party"
    target: "Party"
    cardinality: "many-to-one"
    description: "Receiving party."
  - name: "transfer_mechanism"
    target: "TransferMechanism"
    cardinality: "many-to-one"
    description: "Applicable transfer mechanism."
notes:
  - "Useful for cross-border transfer mapping and accounting for disclosures."
source_context:
  - "Derived from NIST Privacy Framework concepts such as inventory, governance, risk, control, communication, and protection."
  - "Derived from Nymity management activities such as governance, notices, rights handling, assessments, vendor oversight, and breach response."
