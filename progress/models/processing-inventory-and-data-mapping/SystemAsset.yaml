name: "SystemAsset"
domain: "Processing inventory and data mapping"
domain_slug: "processing-inventory-and-data-mapping"
purpose: "System, product, service, or environment involved in privacy-relevant processing."
fields:
  - name: "id"
    type: "string"
    required: true
    description: "Unique identifier."
  - name: "organization_id"
    type: "string"
    required: true
    description: "Parent organization."
  - name: "business_unit_id"
    type: "string"
    required: false
    description: "Owning business unit."
  - name: "name"
    type: "string"
    required: true
    description: "Asset name."
  - name: "asset_type"
    type: "string"
    required: true
    description: "Type such as system, product, service, or dataset."
  - name: "environment"
    type: "string"
    required: false
    description: "Environment such as production or test."
  - name: "hosting_model"
    type: "string"
    required: false
    description: "Hosting model such as internal or cloud."
  - name: "geographic_scope"
    type: "string"
    required: false
    description: "Where the asset operates or stores data."
  - name: "criticality"
    type: "string"
    required: false
    description: "Business or privacy criticality."
  - name: "status"
    type: "enum"
    required: true
    description: "Lifecycle status."
relations:
  - name: "organization"
    target: "Organization"
    cardinality: "many-to-one"
    description: "Parent organization."
  - name: "business_unit"
    target: "BusinessUnit"
    cardinality: "many-to-one"
    description: "Owning business unit."
  - name: "processing_activities"
    target: "ProcessingActivity"
    cardinality: "one-to-many"
    description: "Processing supported by the asset."
  - name: "controls"
    target: "Control"
    cardinality: "many-to-many"
    description: "Controls applied to the asset."
  - name: "data_flows_as_source"
    target: "DataFlow"
    cardinality: "one-to-many"
    description: "Outgoing flows."
  - name: "data_flows_as_target"
    target: "DataFlow"
    cardinality: "one-to-many"
    description: "Incoming flows."
notes:
  - "Captures inventory and environment details referenced by both frameworks."
source_context:
  - "Derived from NIST Privacy Framework concepts such as inventory, governance, risk, control, communication, and protection."
  - "Derived from Nymity management activities such as governance, notices, rights handling, assessments, vendor oversight, and breach response."
