name: "ProcessingPurpose"
domain: "Processing inventory and data mapping"
domain_slug: "processing-inventory-and-data-mapping"
purpose: "Approved reason or business goal for a processing activity."
fields:
  - name: "id"
    type: "string"
    required: true
    description: "Unique identifier."
  - name: "organization_id"
    type: "string"
    required: true
    description: "Parent organization."
  - name: "name"
    type: "string"
    required: true
    description: "Short purpose name."
  - name: "description"
    type: "text"
    required: false
    description: "Detailed explanation of the purpose."
  - name: "business_goal"
    type: "text"
    required: false
    description: "Business outcome or mission supported."
  - name: "status"
    type: "enum"
    required: true
    description: "Lifecycle status."
relations:
  - name: "organization"
    target: "Organization"
    cardinality: "many-to-one"
    description: "Parent organization."
  - name: "processing_activities"
    target: "ProcessingActivity"
    cardinality: "one-to-many"
    description: "Activities that rely on the purpose."
notes:
  - "Purpose limitation and transparency depend on this model being explicit."
source_context:
  - "Derived from NIST Privacy Framework concepts such as inventory, governance, risk, control, communication, and protection."
  - "Derived from Nymity management activities such as governance, notices, rights handling, assessments, vendor oversight, and breach response."
