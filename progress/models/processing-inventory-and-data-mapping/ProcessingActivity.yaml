name: "ProcessingActivity"
domain: "Processing inventory and data mapping"
domain_slug: "processing-inventory-and-data-mapping"
purpose: "Central operational record of a privacy-relevant processing activity."
fields:
  - name: "id"
    type: "string"
    required: true
    description: "Unique identifier."
  - name: "organization_id"
    type: "string"
    required: true
    description: "Parent organization."
  - name: "business_unit_id"
    type: "string"
    required: false
    description: "Owning business unit."
  - name: "system_asset_id"
    type: "string"
    required: false
    description: "Primary system or product."
  - name: "purpose_id"
    type: "string"
    required: true
    description: "Processing purpose."
  - name: "legal_basis_id"
    type: "string"
    required: false
    description: "Applicable legal basis."
  - name: "retention_rule_id"
    type: "string"
    required: false
    description: "Applicable retention rule."
  - name: "name"
    type: "string"
    required: true
    description: "Activity name."
  - name: "description"
    type: "text"
    required: false
    description: "Detailed activity description."
  - name: "activity_status"
    type: "enum"
    required: true
    description: "Lifecycle status for the activity."
  - name: "visibility_level"
    type: "string"
    required: false
    description: "How visible the processing is to individuals."
  - name: "automated_decision_making"
    type: "boolean"
    required: false
    description: "Whether automated decisions are involved."
  - name: "profiling"
    type: "boolean"
    required: false
    description: "Whether profiling occurs."
  - name: "uses_sensitive_data"
    type: "boolean"
    required: false
    description: "Whether sensitive data is processed."
  - name: "uses_children_data"
    type: "boolean"
    required: false
    description: "Whether children or minors data is processed."
  - name: "cross_border_transfer"
    type: "boolean"
    required: false
    description: "Whether the activity involves cross-border transfers."
  - name: "start_date"
    type: "date"
    required: false
    description: "Start date."
  - name: "end_date"
    type: "date"
    required: false
    description: "End date if retired."
relations:
  - name: "organization"
    target: "Organization"
    cardinality: "many-to-one"
    description: "Parent organization."
  - name: "business_unit"
    target: "BusinessUnit"
    cardinality: "many-to-one"
    description: "Owning business unit."
  - name: "system_asset"
    target: "SystemAsset"
    cardinality: "many-to-one"
    description: "Primary asset."
  - name: "purpose"
    target: "ProcessingPurpose"
    cardinality: "many-to-one"
    description: "Processing purpose."
  - name: "legal_basis"
    target: "LegalBasis"
    cardinality: "many-to-one"
    description: "Applicable legal basis."
  - name: "retention_rule"
    target: "RetentionRule"
    cardinality: "many-to-one"
    description: "Applicable retention rule."
  - name: "data_subject_categories"
    target: "DataSubjectCategory"
    cardinality: "many-to-many"
    description: "Affected groups of individuals."
  - name: "data_categories"
    target: "DataCategory"
    cardinality: "many-to-many"
    description: "Data categories involved."
  - name: "data_elements"
    target: "DataElement"
    cardinality: "many-to-many"
    description: "Concrete data elements involved."
  - name: "party_roles"
    target: "ProcessingPartyRole"
    cardinality: "one-to-many"
    description: "Roles played by parties."
  - name: "data_flows"
    target: "DataFlow"
    cardinality: "one-to-many"
    description: "Flows generated by the activity."
  - name: "notices"
    target: "Notice"
    cardinality: "many-to-many"
    description: "Notices describing the activity."
  - name: "assessments"
    target: "Assessment"
    cardinality: "one-to-many"
    description: "Assessments performed on the activity."
  - name: "risks"
    target: "PrivacyRisk"
    cardinality: "one-to-many"
    description: "Risks associated with the activity."
  - name: "incidents"
    target: "Incident"
    cardinality: "one-to-many"
    description: "Incidents associated with the activity."
  - name: "requests"
    target: "DataSubjectRequest"
    cardinality: "one-to-many"
    description: "Rights requests tied to the activity."
  - name: "complaints"
    target: "Complaint"
    cardinality: "one-to-many"
    description: "Complaints tied to the activity."
notes:
  - "This is the center of the privacy operations model."
  - "A lean implementation can start with this table plus key reference tables."
source_context:
  - "Derived from NIST Privacy Framework concepts such as inventory, governance, risk, control, communication, and protection."
  - "Derived from Nymity management activities such as governance, notices, rights handling, assessments, vendor oversight, and breach response."
