name: "DataCategory"
domain: "Processing inventory and data mapping"
domain_slug: "processing-inventory-and-data-mapping"
purpose: "Category or classification of personal data used for inventory and sensitivity mapping."
fields:
  - name: "id"
    type: "string"
    required: true
    description: "Unique identifier."
  - name: "organization_id"
    type: "string"
    required: true
    description: "Parent organization."
  - name: "name"
    type: "string"
    required: true
    description: "Category name."
  - name: "classification"
    type: "string"
    required: false
    description: "Classification such as confidential or public."
  - name: "is_sensitive"
    type: "boolean"
    required: true
    description: "Whether the category is considered sensitive."
  - name: "description"
    type: "text"
    required: false
    description: "Description of the category."
  - name: "status"
    type: "enum"
    required: true
    description: "Lifecycle status."
relations:
  - name: "organization"
    target: "Organization"
    cardinality: "many-to-one"
    description: "Parent organization."
  - name: "data_elements"
    target: "DataElement"
    cardinality: "one-to-many"
    description: "Elements grouped under the category."
  - name: "processing_activities"
    target: "ProcessingActivity"
    cardinality: "many-to-many"
    description: "Activities using the category."
notes:
  - "Supports inventory, minimization, and special-category handling."
source_context:
  - "Derived from NIST Privacy Framework concepts such as inventory, governance, risk, control, communication, and protection."
  - "Derived from Nymity management activities such as governance, notices, rights handling, assessments, vendor oversight, and breach response."
