name: "TrainingAssignment"
domain: "Training and awareness"
domain_slug: "training-and-awareness"
purpose: "Tracks required completion of a training program by a party."
fields:
  - name: "id"
    type: "string"
    required: true
    description: "Unique identifier."
  - name: "training_program_id"
    type: "string"
    required: true
    description: "Assigned training program."
  - name: "party_id"
    type: "string"
    required: true
    description: "Assigned person or entity."
  - name: "due_at"
    type: "datetime"
    required: false
    description: "Completion due date."
  - name: "completed_at"
    type: "datetime"
    required: false
    description: "Completion timestamp."
  - name: "score"
    type: "number"
    required: false
    description: "Assessment or quiz score."
  - name: "status"
    type: "enum"
    required: true
    description: "Assignment status."
relations:
  - name: "training_program"
    target: "TrainingProgram"
    cardinality: "many-to-one"
    description: "Related training program."
  - name: "party"
    target: "Party"
    cardinality: "many-to-one"
    description: "Assigned learner or responsible party."
notes:
  - "Useful for metrics on completion, overdue training, and role-based coverage."
source_context:
  - "Derived from NIST Privacy Framework concepts such as inventory, governance, risk, control, communication, and protection."
  - "Derived from Nymity management activities such as governance, notices, rights handling, assessments, vendor oversight, and breach response."
