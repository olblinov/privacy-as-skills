name: "Assessment"
domain: "Assessments, risk, controls, and monitoring"
domain_slug: "assessments-risk-controls-and-monitoring"
purpose: "Structured evaluation such as a PIA, DPIA, vendor review, or audit."
fields:
  - name: "id"
    type: "string"
    required: true
    description: "Unique identifier."
  - name: "organization_id"
    type: "string"
    required: true
    description: "Parent organization."
  - name: "assessment_type"
    type: "enum"
    required: true
    description: "Type such as pia, dpia, audit, or vendor_assessment."
  - name: "title"
    type: "string"
    required: true
    description: "Assessment title."
  - name: "trigger_reason"
    type: "string"
    required: false
    description: "Why the assessment was initiated."
  - name: "processing_activity_id"
    type: "string"
    required: false
    description: "Related processing activity."
  - name: "system_asset_id"
    type: "string"
    required: false
    description: "Asset in scope."
  - name: "third_party_engagement_id"
    type: "string"
    required: false
    description: "Vendor relationship in scope."
  - name: "lead_assessor_party_id"
    type: "string"
    required: false
    description: "Assessment lead."
  - name: "started_at"
    type: "datetime"
    required: true
    description: "Start timestamp."
  - name: "completed_at"
    type: "datetime"
    required: false
    description: "Completion timestamp."
  - name: "residual_risk_rating"
    type: "string"
    required: false
    description: "Residual risk outcome."
  - name: "regulator_consultation_required"
    type: "boolean"
    required: false
    description: "Whether prior consultation is required."
  - name: "status"
    type: "enum"
    required: true
    description: "Workflow status."
relations:
  - name: "organization"
    target: "Organization"
    cardinality: "many-to-one"
    description: "Parent organization."
  - name: "processing_activity"
    target: "ProcessingActivity"
    cardinality: "many-to-one"
    description: "Activity in scope."
  - name: "system_asset"
    target: "SystemAsset"
    cardinality: "many-to-one"
    description: "Asset in scope."
  - name: "third_party_engagement"
    target: "ThirdPartyEngagement"
    cardinality: "many-to-one"
    description: "Vendor in scope."
  - name: "lead_assessor"
    target: "Party"
    cardinality: "many-to-one"
    description: "Assessment lead."
  - name: "findings"
    target: "AssessmentFinding"
    cardinality: "one-to-many"
    description: "Issues raised by the assessment."
  - name: "risks"
    target: "PrivacyRisk"
    cardinality: "one-to-many"
    description: "Risks identified by the assessment."
  - name: "evidence"
    target: "Evidence"
    cardinality: "one-to-many"
    description: "Completed templates, workshops, approvals, and reports."
notes:
  - "This model supports both initial and change-triggered assessments."
source_context:
  - "Derived from NIST Privacy Framework concepts such as inventory, governance, risk, control, communication, and protection."
  - "Derived from Nymity management activities such as governance, notices, rights handling, assessments, vendor oversight, and breach response."
