name: "MitigationAction"
domain: "Assessments, risk, controls, and monitoring"
domain_slug: "assessments-risk-controls-and-monitoring"
purpose: "Action item created to address a risk, finding, or control gap."
fields:
  - name: "id"
    type: "string"
    required: true
    description: "Unique identifier."
  - name: "privacy_risk_id"
    type: "string"
    required: false
    description: "Associated privacy risk."
  - name: "assessment_finding_id"
    type: "string"
    required: false
    description: "Associated assessment finding."
  - name: "control_id"
    type: "string"
    required: false
    description: "Control being implemented or improved."
  - name: "title"
    type: "string"
    required: true
    description: "Action title."
  - name: "description"
    type: "text"
    required: false
    description: "Description of the action."
  - name: "owner_party_id"
    type: "string"
    required: false
    description: "Action owner."
  - name: "due_at"
    type: "datetime"
    required: false
    description: "Due date."
  - name: "completed_at"
    type: "datetime"
    required: false
    description: "Completion timestamp."
  - name: "status"
    type: "enum"
    required: true
    description: "Workflow status."
relations:
  - name: "privacy_risk"
    target: "PrivacyRisk"
    cardinality: "many-to-one"
    description: "Associated risk."
  - name: "assessment_finding"
    target: "AssessmentFinding"
    cardinality: "many-to-one"
    description: "Associated finding."
  - name: "control"
    target: "Control"
    cardinality: "many-to-one"
    description: "Related control."
  - name: "owner"
    target: "Party"
    cardinality: "many-to-one"
    description: "Action owner."
notes:
  - "Useful for operating a privacy remediation backlog."
source_context:
  - "Derived from NIST Privacy Framework concepts such as inventory, governance, risk, control, communication, and protection."
  - "Derived from Nymity management activities such as governance, notices, rights handling, assessments, vendor oversight, and breach response."
