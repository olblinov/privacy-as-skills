name: "Control"
domain: "Assessments, risk, controls, and monitoring"
domain_slug: "assessments-risk-controls-and-monitoring"
purpose: "Privacy or privacy-relevant safeguard that mitigates risk or satisfies requirements."
fields:
  - name: "id"
    type: "string"
    required: true
    description: "Unique identifier."
  - name: "organization_id"
    type: "string"
    required: true
    description: "Parent organization."
  - name: "privacy_program_id"
    type: "string"
    required: false
    description: "Program governing the control."
  - name: "control_domain"
    type: "string"
    required: true
    description: "Domain such as governance, rights, transfer, or security."
  - name: "name"
    type: "string"
    required: true
    description: "Control name."
  - name: "description"
    type: "text"
    required: false
    description: "Description of the safeguard."
  - name: "implementation_status"
    type: "enum"
    required: true
    description: "Implementation state."
  - name: "control_owner_party_id"
    type: "string"
    required: false
    description: "Control owner."
  - name: "is_automated"
    type: "boolean"
    required: false
    description: "Whether the control is automated."
  - name: "test_cadence"
    type: "string"
    required: false
    description: "Review or test frequency."
  - name: "status"
    type: "enum"
    required: true
    description: "Lifecycle status."
relations:
  - name: "organization"
    target: "Organization"
    cardinality: "many-to-one"
    description: "Parent organization."
  - name: "privacy_program"
    target: "PrivacyProgram"
    cardinality: "many-to-one"
    description: "Governing program."
  - name: "control_owner"
    target: "Party"
    cardinality: "many-to-one"
    description: "Control owner."
  - name: "policies"
    target: "Policy"
    cardinality: "many-to-many"
    description: "Policies that define or support the control."
  - name: "legal_requirements"
    target: "LegalRequirement"
    cardinality: "many-to-many"
    description: "Requirements satisfied by the control."
  - name: "processing_activities"
    target: "ProcessingActivity"
    cardinality: "many-to-many"
    description: "Activities protected by the control."
  - name: "systems"
    target: "SystemAsset"
    cardinality: "many-to-many"
    description: "Assets where the control operates."
  - name: "risks"
    target: "PrivacyRisk"
    cardinality: "many-to-many"
    description: "Risks mitigated by the control."
  - name: "evidence"
    target: "Evidence"
    cardinality: "one-to-many"
    description: "Testing records and operational proof."
notes:
  - "This keeps low-level security detail abstract while preserving privacy relevance."
source_context:
  - "Derived from NIST Privacy Framework concepts such as inventory, governance, risk, control, communication, and protection."
  - "Derived from Nymity management activities such as governance, notices, rights handling, assessments, vendor oversight, and breach response."
