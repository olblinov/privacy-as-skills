name: "AssessmentFinding"
domain: "Assessments, risk, controls, and monitoring"
domain_slug: "assessments-risk-controls-and-monitoring"
purpose: "Specific issue, gap, or recommendation produced by an assessment."
fields:
  - name: "id"
    type: "string"
    required: true
    description: "Unique identifier."
  - name: "assessment_id"
    type: "string"
    required: true
    description: "Parent assessment."
  - name: "title"
    type: "string"
    required: true
    description: "Short finding title."
  - name: "description"
    type: "text"
    required: true
    description: "Detailed finding description."
  - name: "severity"
    type: "string"
    required: true
    description: "Severity rating."
  - name: "recommendation"
    type: "text"
    required: false
    description: "Recommended corrective action."
  - name: "owner_party_id"
    type: "string"
    required: false
    description: "Owner of remediation."
  - name: "due_at"
    type: "datetime"
    required: false
    description: "Remediation due date."
  - name: "resolved_at"
    type: "datetime"
    required: false
    description: "Resolution timestamp."
  - name: "status"
    type: "enum"
    required: true
    description: "Workflow status."
relations:
  - name: "assessment"
    target: "Assessment"
    cardinality: "many-to-one"
    description: "Parent assessment."
  - name: "owner"
    target: "Party"
    cardinality: "many-to-one"
    description: "Remediation owner."
  - name: "mitigation_actions"
    target: "MitigationAction"
    cardinality: "one-to-many"
    description: "Actions raised from the finding."
  - name: "evidence"
    target: "Evidence"
    cardinality: "one-to-many"
    description: "Supporting proof and closure artifacts."
notes:
  - "Use severity and due dates to drive remediation workflows."
source_context:
  - "Derived from NIST Privacy Framework concepts such as inventory, governance, risk, control, communication, and protection."
  - "Derived from Nymity management activities such as governance, notices, rights handling, assessments, vendor oversight, and breach response."
