name: "Incident"
domain: "Incidents and breach response"
domain_slug: "incidents-and-breach-response"
purpose: "Privacy incident or breach tracked through investigation and response."
fields:
  - name: "id"
    type: "string"
    required: true
    description: "Unique identifier."
  - name: "organization_id"
    type: "string"
    required: true
    description: "Parent organization."
  - name: "processing_activity_id"
    type: "string"
    required: false
    description: "Related activity."
  - name: "system_asset_id"
    type: "string"
    required: false
    description: "Related asset."
  - name: "third_party_engagement_id"
    type: "string"
    required: false
    description: "Related third party engagement."
  - name: "incident_type"
    type: "enum"
    required: true
    description: "Type such as breach, disclosure, or rights_failure."
  - name: "severity"
    type: "string"
    required: true
    description: "Severity rating."
  - name: "detected_at"
    type: "datetime"
    required: true
    description: "Detection timestamp."
  - name: "contained_at"
    type: "datetime"
    required: false
    description: "Containment timestamp."
  - name: "closed_at"
    type: "datetime"
    required: false
    description: "Closure timestamp."
  - name: "likely_risk_to_individuals"
    type: "boolean"
    required: false
    description: "Whether individuals are likely at risk."
  - name: "root_cause"
    type: "text"
    required: false
    description: "Root cause analysis."
  - name: "impact_summary"
    type: "text"
    required: false
    description: "Summary of impact."
  - name: "response_owner_party_id"
    type: "string"
    required: false
    description: "Incident response owner."
  - name: "status"
    type: "enum"
    required: true
    description: "Workflow status."
relations:
  - name: "organization"
    target: "Organization"
    cardinality: "many-to-one"
    description: "Parent organization."
  - name: "processing_activity"
    target: "ProcessingActivity"
    cardinality: "many-to-one"
    description: "Related activity."
  - name: "system_asset"
    target: "SystemAsset"
    cardinality: "many-to-one"
    description: "Related asset."
  - name: "third_party_engagement"
    target: "ThirdPartyEngagement"
    cardinality: "many-to-one"
    description: "Related third party."
  - name: "response_owner"
    target: "Party"
    cardinality: "many-to-one"
    description: "Assigned response owner."
  - name: "notifications"
    target: "BreachNotification"
    cardinality: "one-to-many"
    description: "Notifications triggered by the incident."
  - name: "evidence"
    target: "Evidence"
    cardinality: "one-to-many"
    description: "Investigation, decision, and closure records."
notes:
  - "Supports both event handling and breach reporting obligations."
source_context:
  - "Derived from NIST Privacy Framework concepts such as inventory, governance, risk, control, communication, and protection."
  - "Derived from Nymity management activities such as governance, notices, rights handling, assessments, vendor oversight, and breach response."
