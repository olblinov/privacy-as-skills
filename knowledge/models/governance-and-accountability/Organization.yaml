name: "Organization"
domain: "Governance and accountability"
domain_slug: "governance-and-accountability"
purpose: "Root entity for the privacy program and the parent scope for nearly all privacy operations."
fields:
  - name: "id"
    type: "string"
    required: true
    description: "Unique identifier."
  - name: "name"
    type: "string"
    required: true
    description: "Organization name."
  - name: "primary_jurisdiction"
    type: "string"
    required: false
    description: "Main legal or operating jurisdiction."
  - name: "risk_tolerance_statement"
    type: "text"
    required: false
    description: "Declared privacy risk tolerance."
  - name: "privacy_mission"
    type: "text"
    required: false
    description: "Mission or charter statement for privacy management."
  - name: "status"
    type: "enum"
    required: true
    description: "Lifecycle status of the organization record."
relations:
  - name: "business_units"
    target: "BusinessUnit"
    cardinality: "one-to-many"
    description: "Business units within the organization."
  - name: "privacy_programs"
    target: "PrivacyProgram"
    cardinality: "one-to-many"
    description: "Privacy programs operated by the organization."
  - name: "policies"
    target: "Policy"
    cardinality: "one-to-many"
    description: "Policies maintained by the organization."
  - name: "legal_requirements"
    target: "LegalRequirement"
    cardinality: "one-to-many"
    description: "Applicable obligations tracked by the organization."
  - name: "regulatory_changes"
    target: "RegulatoryChange"
    cardinality: "one-to-many"
    description: "Tracked legal and regulatory developments."
  - name: "training_programs"
    target: "TrainingProgram"
    cardinality: "one-to-many"
    description: "Training and awareness programs."
  - name: "processing_activities"
    target: "ProcessingActivity"
    cardinality: "one-to-many"
    description: "Recorded processing operations."
  - name: "incidents"
    target: "Incident"
    cardinality: "one-to-many"
    description: "Privacy incidents associated with the organization."
notes:
  - "Use as the tenancy boundary for the privacy data model."
  - "Useful top-level filters include jurisdiction and status."
source_context:
  - "Derived from NIST Privacy Framework concepts such as inventory, governance, risk, control, communication, and protection."
  - "Derived from Nymity management activities such as governance, notices, rights handling, assessments, vendor oversight, and breach response."
