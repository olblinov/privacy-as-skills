name: "OrganizationRequirements"
domain: "Governance and accountability"
domain_slug: "governance-and-accountability"
purpose: "Internal requirement derived from organizational goals, values, commitments, or agreements that drives privacy actions."
fields:
  - name: "id"
    type: "string"
    required: true
    description: "Unique identifier."
  - name: "organization_id"
    type: "string"
    required: true
    description: "Parent organization."
  - name: "business_unit_id"
    type: "string"
    required: false
    description: "Owning business unit when scoped locally."
  - name: "owner_party_id"
    type: "string"
    required: false
    description: "Responsible owner."
  - name: "counterparty_party_id"
    type: "string"
    required: false
    description: "Related party when the requirement comes from an agreement or commitment."
  - name: "source_type"
    type: "enum"
    required: true
    description: "Origin such as goal, value, commitment, or agreement."
  - name: "source_name"
    type: "string"
    required: true
    description: "Name of the strategy, principle, pledge, or agreement."
  - name: "source_reference"
    type: "string"
    required: false
    description: "Reference to the source document, statement, or agreement."
  - name: "title"
    type: "string"
    required: true
    description: "Short title of the requirement."
  - name: "topic"
    type: "string"
    required: false
    description: "Subject area such as transparency, retention, or vendor standards."
  - name: "requirement_text"
    type: "text"
    required: true
    description: "Plain-language requirement statement."
  - name: "objective"
    type: "text"
    required: false
    description: "Organizational objective or value the requirement supports."
  - name: "effective_date"
    type: "date"
    required: false
    description: "Date requirement becomes effective."
  - name: "status"
    type: "enum"
    required: true
    description: "Tracking status."
relations:
  - name: "organization"
    target: "Organization"
    cardinality: "many-to-one"
    description: "Parent organization."
  - name: "business_unit"
    target: "BusinessUnit"
    cardinality: "many-to-one"
    description: "Optional local owner."
  - name: "owner"
    target: "Party"
    cardinality: "many-to-one"
    description: "Responsible owner."
  - name: "counterparty"
    target: "Party"
    cardinality: "many-to-one"
    description: "Related agreement or commitment counterparty."
  - name: "policies"
    target: "Policy"
    cardinality: "many-to-many"
    description: "Policies that implement the requirement."
  - name: "controls"
    target: "Control"
    cardinality: "many-to-many"
    description: "Controls that satisfy the requirement."
  - name: "processing_activities"
    target: "ProcessingActivity"
    cardinality: "many-to-many"
    description: "Activities impacted by the requirement."
  - name: "notices"
    target: "Notice"
    cardinality: "many-to-many"
    description: "Notices informed by the requirement."
notes:
  - "Use to track privacy obligations that come from strategy, trust commitments, values, or negotiated agreements rather than directly from law."
source_context:
  - "Derived from NIST Privacy Framework concepts such as inventory, governance, risk, control, communication, and protection."
  - "Derived from Nymity management activities such as governance, notices, rights handling, assessments, vendor oversight, and breach response."
