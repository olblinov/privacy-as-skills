name: "PrivacyProgram"
domain: "Governance and accountability"
domain_slug: "governance-and-accountability"
purpose: "Program-level representation of privacy strategy, ownership, and review cadence."
fields:
  - name: "id"
    type: "string"
    required: true
    description: "Unique identifier."
  - name: "organization_id"
    type: "string"
    required: true
    description: "Parent organization."
  - name: "name"
    type: "string"
    required: true
    description: "Program name."
  - name: "charter"
    type: "text"
    required: false
    description: "Program charter or mission."
  - name: "strategy"
    type: "text"
    required: false
    description: "Program strategy or operating approach."
  - name: "program_owner_party_id"
    type: "string"
    required: true
    description: "Primary accountable owner."
  - name: "dpo_party_id"
    type: "string"
    required: false
    description: "Assigned data protection officer."
  - name: "review_cadence"
    type: "string"
    required: false
    description: "How often the program is reviewed."
  - name: "status"
    type: "enum"
    required: true
    description: "Lifecycle status."
relations:
  - name: "organization"
    target: "Organization"
    cardinality: "many-to-one"
    description: "Parent organization."
  - name: "program_owner"
    target: "Party"
    cardinality: "many-to-one"
    description: "Program owner."
  - name: "dpo"
    target: "Party"
    cardinality: "many-to-one"
    description: "Assigned DPO."
  - name: "policies"
    target: "Policy"
    cardinality: "one-to-many"
    description: "Policies governed by the program."
  - name: "controls"
    target: "Control"
    cardinality: "one-to-many"
    description: "Controls run under the program."
  - name: "metrics"
    target: "Metric"
    cardinality: "one-to-many"
    description: "Program metrics."
notes:
  - "Useful for demonstrating governance structure and accountability."
source_context:
  - "Derived from NIST Privacy Framework concepts such as inventory, governance, risk, control, communication, and protection."
  - "Derived from Nymity management activities such as governance, notices, rights handling, assessments, vendor oversight, and breach response."
