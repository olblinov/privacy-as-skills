name: "LegalBasis"
domain: "Processing inventory and data mapping"
domain_slug: "processing-inventory-and-data-mapping"
purpose: "Permitted legal ground for processing under a relevant jurisdiction."
fields:
  - name: "id"
    type: "string"
    required: true
    description: "Unique identifier."
  - name: "organization_id"
    type: "string"
    required: true
    description: "Parent organization."
  - name: "basis_type"
    type: "enum"
    required: true
    description: "Type such as consent, contract, or legitimate_interest."
  - name: "jurisdiction"
    type: "string"
    required: true
    description: "Jurisdiction for the basis."
  - name: "description"
    type: "text"
    required: false
    description: "Notes on applicability."
  - name: "source_reference"
    type: "string"
    required: false
    description: "Citation or legal reference."
  - name: "requires_consent"
    type: "boolean"
    required: true
    description: "Whether the basis depends on recorded consent or preference."
  - name: "status"
    type: "enum"
    required: true
    description: "Lifecycle status."
relations:
  - name: "organization"
    target: "Organization"
    cardinality: "many-to-one"
    description: "Parent organization."
  - name: "processing_activities"
    target: "ProcessingActivity"
    cardinality: "one-to-many"
    description: "Activities grounded in this basis."
  - name: "preference_records"
    target: "PreferenceRecord"
    cardinality: "one-to-many"
    description: "Preferences captured under the basis."
notes:
  - "Use when teams need to separate business purpose from legal permissibility."
source_context:
  - "Derived from NIST Privacy Framework concepts such as inventory, governance, risk, control, communication, and protection."
  - "Derived from Nymity management activities such as governance, notices, rights handling, assessments, vendor oversight, and breach response."
