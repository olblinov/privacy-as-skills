name: "RetentionRule"
domain: "Processing inventory and data mapping"
domain_slug: "processing-inventory-and-data-mapping"
purpose: "Retention and disposal rule for processing activities and data elements."
fields:
  - name: "id"
    type: "string"
    required: true
    description: "Unique identifier."
  - name: "organization_id"
    type: "string"
    required: true
    description: "Parent organization."
  - name: "name"
    type: "string"
    required: true
    description: "Rule name."
  - name: "trigger_event"
    type: "string"
    required: false
    description: "Event that starts the retention clock."
  - name: "retention_period"
    type: "string"
    required: true
    description: "Retention duration or schedule."
  - name: "disposal_method"
    type: "string"
    required: false
    description: "Deletion, anonymization, destruction, or archive handling."
  - name: "legal_hold_supported"
    type: "boolean"
    required: false
    description: "Whether legal hold exceptions are supported."
  - name: "status"
    type: "enum"
    required: true
    description: "Lifecycle status."
relations:
  - name: "organization"
    target: "Organization"
    cardinality: "many-to-one"
    description: "Parent organization."
  - name: "processing_activities"
    target: "ProcessingActivity"
    cardinality: "one-to-many"
    description: "Activities governed by the rule."
  - name: "data_elements"
    target: "DataElement"
    cardinality: "one-to-many"
    description: "Elements specifically linked to the rule."
notes:
  - "Supports storage limitation and secure destruction workflows."
source_context:
  - "Derived from NIST Privacy Framework concepts such as inventory, governance, risk, control, communication, and protection."
  - "Derived from Nymity management activities such as governance, notices, rights handling, assessments, vendor oversight, and breach response."
