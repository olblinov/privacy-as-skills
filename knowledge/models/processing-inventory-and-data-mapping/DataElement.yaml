name: "DataElement"
domain: "Processing inventory and data mapping"
domain_slug: "processing-inventory-and-data-mapping"
purpose: "Concrete field or attribute processed by systems and workflows."
fields:
  - name: "id"
    type: "string"
    required: true
    description: "Unique identifier."
  - name: "organization_id"
    type: "string"
    required: true
    description: "Parent organization."
  - name: "data_category_id"
    type: "string"
    required: true
    description: "Owning data category."
  - name: "retention_rule_id"
    type: "string"
    required: false
    description: "Optional retention rule governing this element."
  - name: "name"
    type: "string"
    required: true
    description: "Element name."
  - name: "description"
    type: "text"
    required: false
    description: "Description of the element."
  - name: "format"
    type: "string"
    required: false
    description: "Format such as string, date, token, or image."
  - name: "is_direct_identifier"
    type: "boolean"
    required: false
    description: "Whether the value directly identifies an individual."
  - name: "source_system"
    type: "string"
    required: false
    description: "Origin system or collection source."
  - name: "status"
    type: "enum"
    required: true
    description: "Lifecycle status."
relations:
  - name: "organization"
    target: "Organization"
    cardinality: "many-to-one"
    description: "Parent organization."
  - name: "data_category"
    target: "DataCategory"
    cardinality: "many-to-one"
    description: "Owning category."
  - name: "processing_activities"
    target: "ProcessingActivity"
    cardinality: "many-to-many"
    description: "Activities processing the element."
  - name: "retention_rule"
    target: "RetentionRule"
    cardinality: "many-to-one"
    description: "Optional retention rule."
notes:
  - "Most useful when an inventory must go beyond broad categories."
source_context:
  - "Derived from NIST Privacy Framework concepts such as inventory, governance, risk, control, communication, and protection."
  - "Derived from Nymity management activities such as governance, notices, rights handling, assessments, vendor oversight, and breach response."
