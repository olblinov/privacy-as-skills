name: "ProcessingPartyRole"
domain: "Processing inventory and data mapping"
domain_slug: "processing-inventory-and-data-mapping"
purpose: "Join entity assigning a party and role to a processing activity."
fields:
  - name: "id"
    type: "string"
    required: true
    description: "Unique identifier."
  - name: "processing_activity_id"
    type: "string"
    required: true
    description: "Processing activity."
  - name: "party_id"
    type: "string"
    required: true
    description: "Related party."
  - name: "role_type"
    type: "string"
    required: true
    description: "Role such as owner, processor, or approver."
  - name: "is_primary"
    type: "boolean"
    required: false
    description: "Whether the role is the primary accountable one."
  - name: "notes"
    type: "text"
    required: false
    description: "Additional role notes."
relations:
  - name: "processing_activity"
    target: "ProcessingActivity"
    cardinality: "many-to-one"
    description: "Related processing activity."
  - name: "party"
    target: "Party"
    cardinality: "many-to-one"
    description: "Assigned party."
notes:
  - "Use to capture controllers, processors, owners, and reviewers without duplicating actor fields."
source_context:
  - "Derived from NIST Privacy Framework concepts such as inventory, governance, risk, control, communication, and protection."
  - "Derived from Nymity management activities such as governance, notices, rights handling, assessments, vendor oversight, and breach response."
