name: "Metric"
domain: "Assessments, risk, controls, and monitoring"
domain_slug: "assessments-risk-controls-and-monitoring"
purpose: "Periodic metric used to report privacy-program performance or operational health."
fields:
  - name: "id"
    type: "string"
    required: true
    description: "Unique identifier."
  - name: "organization_id"
    type: "string"
    required: true
    description: "Parent organization."
  - name: "privacy_program_id"
    type: "string"
    required: false
    description: "Associated privacy program."
  - name: "name"
    type: "string"
    required: true
    description: "Metric name."
  - name: "metric_domain"
    type: "string"
    required: true
    description: "Domain such as training, requests, incidents, or assessments."
  - name: "definition"
    type: "text"
    required: false
    description: "How the metric is defined."
  - name: "period_start"
    type: "date"
    required: true
    description: "Measurement period start."
  - name: "period_end"
    type: "date"
    required: true
    description: "Measurement period end."
  - name: "value"
    type: "string"
    required: true
    description: "Reported metric value."
  - name: "unit"
    type: "string"
    required: false
    description: "Unit of measure."
  - name: "target"
    type: "string"
    required: false
    description: "Optional target or threshold."
  - name: "status"
    type: "enum"
    required: true
    description: "Lifecycle status."
relations:
  - name: "organization"
    target: "Organization"
    cardinality: "many-to-one"
    description: "Parent organization."
  - name: "privacy_program"
    target: "PrivacyProgram"
    cardinality: "many-to-one"
    description: "Related privacy program."
notes:
  - "Useful for management reporting and accountability evidence."
source_context:
  - "Derived from NIST Privacy Framework concepts such as inventory, governance, risk, control, communication, and protection."
  - "Derived from Nymity management activities such as governance, notices, rights handling, assessments, vendor oversight, and breach response."
