name: "Notice"
domain: "Notices, preferences, rights, and complaints"
domain_slug: "notices-preferences-rights-and-complaints"
purpose: "Privacy notice or transparency artifact presented to individuals or stakeholders."
fields:
  - name: "id"
    type: "string"
    required: true
    description: "Unique identifier."
  - name: "organization_id"
    type: "string"
    required: true
    description: "Parent organization."
  - name: "title"
    type: "string"
    required: true
    description: "Notice title."
  - name: "notice_type"
    type: "string"
    required: true
    description: "Type such as collection notice, employee notice, or breach notice."
  - name: "audience"
    type: "string"
    required: false
    description: "Intended audience."
  - name: "channel"
    type: "string"
    required: false
    description: "Web, contract, signage, email, or script."
  - name: "collection_point"
    type: "string"
    required: false
    description: "Where notice is presented."
  - name: "version"
    type: "string"
    required: false
    description: "Version identifier."
  - name: "effective_date"
    type: "date"
    required: false
    description: "Date notice takes effect."
  - name: "status"
    type: "enum"
    required: true
    description: "Lifecycle status."
relations:
  - name: "organization"
    target: "Organization"
    cardinality: "many-to-one"
    description: "Parent organization."
  - name: "processing_activities"
    target: "ProcessingActivity"
    cardinality: "many-to-many"
    description: "Activities described by the notice."
  - name: "legal_requirements"
    target: "LegalRequirement"
    cardinality: "many-to-many"
    description: "Requirements informing the notice."
  - name: "evidence"
    target: "Evidence"
    cardinality: "one-to-many"
    description: "Approved copies, screenshots, and publication records."
notes:
  - "Supports transparency, collection-point notices, and public-facing obligations."
source_context:
  - "Derived from NIST Privacy Framework concepts such as inventory, governance, risk, control, communication, and protection."
  - "Derived from Nymity management activities such as governance, notices, rights handling, assessments, vendor oversight, and breach response."
